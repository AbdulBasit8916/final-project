<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Food Good Mood</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .navbar-dark-custom {
      background-color: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    .brand-logo {
      color: #ffb703;
      font-weight: 700;
      font-size: 1.4rem;
    }

    .food-card {
      background-color: #1f1f1f;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .food-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(255, 183, 3, 0.15);
    }

    .food-card-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background-color: #2a2a2a;
    }

    .food-card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .food-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    .add-btn {
      background-color: #ffb703;
      color: #000000;
      border: none;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .add-btn:hover {
      background-color: #ffa200;
    }

    .modal-content {
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
    }

    .form-control {
      background-color: #262626;
      border: 1px solid #3d3d3d;
      color: #fff;
    }

    .form-control:focus {
      background-color: #2d2d2d;
      color: #fff;
      border-color: #ffb703;
      box-shadow: none;
    }

    .btn-orange {
      background-color: #ffb703;
      color: #000;
      font-weight: 600;
    }

    .btn-orange:hover {
      background-color: #ffa200;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-dark-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand brand-logo d-flex align-items-center gap-2" href="#">
        <i class="bi bi-cup-hot-fill fs-3"></i>
        <span>Good Food Good Mood</span>
      </a>
      
      <div class="d-flex align-items-center gap-3 ms-auto">
        <!-- Search Input -->
        <div class="input-group" style="max-width: 220px;">
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search menu...">
        </div>

        <!-- Vendor Modal Trigger -->
        <button class="btn btn-orange btn-sm d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#vendorModal">
          <i class="bi bi-shop"></i> Add Vendor
        </button>

        <!-- Auth Modal Trigger -->
        <button class="btn btn-outline-warning btn-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#authModal">
          <span id="topAvatar" class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:22px; height:22px; font-size:11px;">
            <i class="bi bi-person-fill"></i>
          </span>
          <span id="topUserName">Login</span>
        </button>

        <!-- Cart Badge -->
        <div class="position-relative">
          <button class="btn btn-dark border-secondary text-warning btn-sm fs-5">
            <i class="bi bi-cart3"></i>
          </button>
          <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container my-4">
    <!-- Menu Title -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold d-flex align-items-center gap-2">
        <i class="bi bi-grid-fill text-warning"></i> Our Menu
      </h3>
    </div>

    <!-- FOOD GRID CONTAINER -->
    <div id="foodGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
      <!-- JavaScript dynamic items inject karega -->
    </div>

    <!-- VENDORS SECTION -->
    <div class="mt-5 pt-4 border-top border-secondary">
      <h4 class="fw-bold mb-3 text-warning"><i class="bi bi-people-fill me-2"></i>Registered Vendors</h4>
      <div id="vendorGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <!-- Database vendors dynamic render honge -->
      </div>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold text-warning"><i class="bi bi-person-circle me-2"></i>Login / Signup</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="authForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Email address</label>
              <input type="email" id="authEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Password</label>
              <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-orange w-100 fw-bold mt-2">Continue</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- VENDOR MODAL -->
  <div class="modal fade" id="vendorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold text-warning"><i class="bi bi-shop me-2"></i>Add New Vendor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="vendorForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Vendor/Restaurant Name</label>
              <input type="text" id="vendorName" class="form-control" placeholder="e.g. Burger Lab" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Phone Number</label>
              <input type="tel" id="vendorPhone" class="form-control" placeholder="e.g. 03001234567" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Address / Location</label>
              <input type="text" id="vendorAddress" class="form-control" placeholder="e.g. Gulshan Branch" required>
            </div>
            <button type="submit" class="btn btn-orange w-100 fw-bold mt-2">Save Vendor</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Firebase & App Logic JS -->
  <script type="module" src="script.js"></script>
</body>
</html>
