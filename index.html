<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Food Good Mood</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="bi bi-cup-hot-fill"></i>
        <span>Good Food Good Mood</span>
      </a>

      <div class="d-flex align-items-center gap-3 ms-auto">
        <!-- Search Bar -->
        <div class="input-group" style="max-width: 200px;">
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search menu...">
        </div>

        <!-- Add Vendor Button -->
        <button class="btn btn-warning btn-sm d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#vendorModal">
          <i class="bi bi-shop"></i> Add Vendor
        </button>

        <!-- Auth Button -->
        <button class="btn btn-outline-warning btn-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#authModal">
          <span id="topAvatar" class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:22px; height:22px; font-size:11px;">
            <i class="bi bi-person-fill"></i>
          </span>
          <span id="topUserName">Login</span>
        </button>

        <!-- Cart Icon -->
        <div class="position-relative">
          <button class="btn btn-dark border-secondary text-orange btn-sm fs-5">
            <i class="bi bi-cart3"></i>
          </button>
          <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <div class="container my-4">
    <!-- Menu Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-orange d-flex align-items-center gap-2">
        <i class="bi bi-grid-fill"></i> Our Menu
      </h3>
    </div>

    <!-- FOOD GRID CONTAINER -->
    <div id="foodGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
      <!-- Dynamic Food Cards -->
    </div>

    <!-- REGISTERED VENDORS FROM DATABASE -->
    <div class="mt-5 pt-4 border-top border-secondary">
      <h4 class="fw-bold mb-3 text-orange"><i class="bi bi-people-fill me-2"></i>Registered Vendors</h4>
      <div id="vendorGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <!-- Dynamic Vendors -->
      </div>
    </div>
  </div>

  <!-- AUTH MODAL (Login / Signup) -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold text-orange"><i class="bi bi-person-circle me-2"></i>Login / Signup</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="authForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Email address</label>
              <input type="email" id="authEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Password</label>
              <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Continue</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- VENDOR MODAL -->
  <div class="modal fade" id="vendorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold text-orange"><i class="bi bi-shop me-2"></i>Add New Vendor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="vendorForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Vendor/Restaurant Name</label>
              <input type="text" id="vendorName" class="form-control" placeholder="e.g. Burger Lab" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Phone Number</label>
              <input type="tel" id="vendorPhone" class="form-control" placeholder="e.g. 03001234567" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Address / Location</label>
              <input type="text" id="vendorAddress" class="form-control" placeholder="e.g. Gulshan Branch" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Save Vendor</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript App Logic -->
  <script type="module" src="script.js"></script>
</body>
</html>
