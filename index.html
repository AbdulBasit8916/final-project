<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Food Good Mood</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .navbar-dark-custom {
      background-color: #1f1f1f;
      border-bottom: 1px solid #333;
    }

    .food-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .food-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(255, 193, 7, 0.2);
    }

    .food-card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .food-card-body {
      padding: 15px;
    }

    .food-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .add-btn {
      background-color: #ffc107;
      color: #000;
      border: none;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      transition: background-color 0.2s;
    }

    .add-btn:hover {
      background-color: #e0a800;
    }

    .modal-content {
      background-color: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
    }

    .form-control {
      background-color: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
    }

    .form-control:focus {
      background-color: #333;
      color: #fff;
      border-color: #ffc107;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-dark-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning fs-4" href="#">
        <i class="bi bi-cup-hot-fill me-2"></i>Good Food Good Mood
      </a>
      
      <div class="d-flex align-items-center gap-3 ms-auto">
        <div class="input-group" style="max-width: 250px;">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search food...">
        </div>

        <button class="btn btn-outline-warning btn-sm" data-bs-toggle="modal" data-bs-target="#vendorModal">
          <i class="bi bi-shop me-1"></i> Add Vendor
        </button>

        <button class="btn btn-warning btn-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#authModal">
          <span id="topAvatar" class="bg-dark text-warning rounded-circle d-flex align-items-center justify-content-center" style="width:24px; height:24px; font-size:12px;">
            <i class="bi bi-person-fill"></i>
          </span>
          <span id="topUserName">Login</span>
        </button>

        <div class="position-relative">
          <button class="btn btn-dark border-secondary text-warning btn-sm fs-5">
            <i class="bi bi-cart3"></i>
          </button>
          <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold"><i class="bi bi-grid-fill text-warning me-2"></i>Our Menu</h3>
    </div>

    <div id="foodGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-3 g-4">
      </div>

    <div class="mt-5 pt-4 border-top border-secondary">
      <h4 class="fw-bold mb-3"><i class="bi bi-people-fill text-warning me-2"></i>Registered Vendors</h4>
      <div id="vendorGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        </div>
    </div>
  </div>

  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold"><i class="bi bi-person-circle me-2 text-warning"></i>Login / Signup</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="authForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Email address</label>
              <input type="email" id="authEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Password</label>
              <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Continue</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="vendorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold"><i class="bi bi-shop me-2 text-warning"></i>Add New Vendor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="vendorForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Vendor/Restaurant Name</label>
              <input type="text" id="vendorName" class="form-control" placeholder="e.g. Burger Lab" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Phone Number</label>
              <input type="tel" id="vendorPhone" class="form-control" placeholder="e.g. 03001234567" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Address / Location</label>
              <input type="text" id="vendorAddress" class="form-control" placeholder="e.g. Gulshan Branch" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Save Vendor</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module" src="script.js"></script>
</body>
</html>
