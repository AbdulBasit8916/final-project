<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Food Good Mood</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand-logo mb-4">
        <i class="bi bi-cup-hot-fill text-orange fs-3"></i>
        <span class="fw-bold fs-4 text-white ms-2">Food <span class="text-orange">Men</span></span>
      </div>

      <ul class="nav flex-column gap-2">
        <li class="nav-item">
          <a class="nav-link active d-flex align-items-center gap-3" href="#"><i class="bi bi-house-door-fill"></i> Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-3" href="#foodGrid"><i class="bi bi-grid"></i> Menu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-3" href="#vendorGrid"><i class="bi bi-shop"></i> Vendors</a>
        </li>
      </ul>

      <div class="sidebar-buttons mt-auto pt-4 d-flex flex-column gap-2">
        <button class="btn btn-orange-outline w-100 d-flex align-items-center justify-content-center gap-2" id="openVendorBtn">
          <i class="bi bi-plus-circle"></i> Add Vendor
        </button>
        <button class="btn btn-orange-outline w-100 d-flex align-items-center justify-content-center gap-2" id="sideLoginBtn">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      <!-- TOP HEADER -->
      <header class="top-header d-flex align-items-center justify-content-between mb-4">
        <div class="search-box">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="searchInput" class="form-control" placeholder="Search food, vendors...">
        </div>

        <div class="header-right d-flex align-items-center gap-3">
          <div class="cart-badge-container">
            <i class="bi bi-bag fs-5"></i>
            <span id="cartCount" class="cart-badge">0</span>
          </div>

          <div class="user-profile-badge d-flex align-items-center gap-2">
            <div class="avatar bg-warning text-dark fw-bold rounded-circle d-flex align-items-center justify-content-center">G</div>
            <div class="d-flex flex-column lh-1">
              <span class="fw-bold small text-white" id="topUserName">Guest</span>
              <i class="bi bi-chevron-down small text-muted mt-1"></i>
            </div>
          </div>
        </div>
      </header>

      <!-- HERO BANNER -->
      <section class="hero-section mb-5">
        <div class="hero-text">
          <small class="text-orange fw-bold d-flex align-items-center gap-1 mb-2">
            <i class="bi bi-stars"></i> Deliciousness delivered
          </small>
          <h1 class="hero-title">Good food.<br><span class="text-orange">Good mood.</span></h1>
          <p class="text-muted">Discover your favorite meals, restaurants and local food vendors in one place.</p>
          <div class="d-flex align-items-center gap-3 mt-4">
            <a href="#foodGrid" class="btn btn-orange px-4 py-2">Explore Menu <i class="bi bi-arrow-right ms-1"></i></a>
            <a href="#vendorGrid" class="text-orange text-decoration-none fw-semibold">View Vendors</a>
          </div>
        </div>
        <div class="hero-image-container">
          <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80" alt="Burger" class="hero-img">
        </div>
      </section>

      <!-- MENU GRID SECTION -->
      <section class="mb-5">
        <h4 class="fw-bold text-white mb-4"><i class="bi bi-grid-fill text-orange me-2"></i>Our Menu</h4>
        <div id="foodGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
          <!-- Dynamic cards via JS -->
        </div>
      </section>

      <!-- VENDORS SECTION -->
      <section class="pt-4 border-top border-secondary">
        <h4 class="fw-bold text-white mb-4"><i class="bi bi-shop text-orange me-2"></i>Registered Vendors</h4>
        <div id="vendorGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
          <!-- Dynamic Vendors via JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- AUTH MODAL -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold text-orange"><i class="bi bi-person-circle me-2"></i>Login</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="authForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Email address</label>
              <input type="email" id="authEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Password</label>
              <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-orange w-100 fw-bold mt-2">Continue</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- VENDOR MODAL -->
  <div class="modal fade" id="vendorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold text-orange"><i class="bi bi-shop me-2"></i>Add New Vendor</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="vendorForm">
            <div class="mb-3">
              <label class="form-label text-muted small">Vendor/Restaurant Name</label>
              <input type="text" id="vendorName" class="form-control" placeholder="e.g. Burger Lab" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Phone Number</label>
              <input type="tel" id="vendorPhone" class="form-control" placeholder="e.g. 03001234567" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Address / Location</label>
              <input type="text" id="vendorAddress" class="form-control" placeholder="e.g. Gulshan Branch" required>
            </div>
            <button type="submit" class="btn btn-orange w-100 fw-bold mt-2">Save Vendor</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script src="script.js"></script>
</body>
</html>
